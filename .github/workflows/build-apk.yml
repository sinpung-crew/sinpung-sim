# 안드로이드 앱(APK) 자동 빌드
# android/ 폴더가 바뀌거나, Actions 탭에서 "Run workflow"를 누르면 실행됩니다.
# 완성된 APK는 Releases에 올라가고, 웹 페이지의 "안드로이드 앱 설치 파일 받기" 버튼이 이 파일을 가리킵니다.
name: 안드로이드 앱 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: 콘텐츠 주소 정하기
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -n "${{ vars.CONTENT_BASE }}" ]; then
            base="${{ vars.CONTENT_BASE }}"
          elif [ "${repo,,}" = "${owner}.github.io" ]; then
            base="https://${owner}.github.io/data/"
          else
            base="https://${owner}.github.io/${repo}/data/"
          fi
          echo "CONTENT_BASE=$base" >> "$GITHUB_ENV"
          echo "콘텐츠 주소: $base"

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=sinpung-sim-key" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=sinpung-sim-key" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=sinpung" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 비밀값이 없어 테스트용(임시 서명)으로만 빌드합니다. Releases에는 올리지 않습니다."
          fi

      - name: APK 빌드
        run: gradle -p android assembleRelease -PcontentBase="$CONTENT_BASE" -PversionCode=${{ github.run_number }} --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk sinpung-sim.apk

      - uses: actions/upload-artifact@v5
        with:
          name: sinpung-sim-apk
          path: sinpung-sim.apk

      # 정식 서명 키가 있을 때만 배포용으로 올림 (없으면 위의 테스트용 파일만 남김)
      - name: Releases에 올리기
        if: env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v1.0.${{ github.run_number }}
          name: 신풍승무 시뮬레이터 앱 1.0.${{ github.run_number }}
          body: |
            안드로이드 설치 파일입니다. 휴대폰에서 sinpung-sim.apk 를 눌러 설치하세요.
            시뮬레이터 내용(규정 변경 등)은 앱을 켤 때 자동으로 업데이트되므로, 앱을 다시 설치할 필요가 없습니다.
          files: sinpung-sim.apk
          make_latest: true
